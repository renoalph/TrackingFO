<script>
  // ============================================================
  // Charts.html — Funnel milestone (Google Charts) + Distribusi
  // Status Akhir Aktual vs Sistem (Chart.js grouped bar).
  // Peta & 4 chart lama (operator/kabupaten/tren/aging) sudah dihapus.
  // ============================================================

  google.charts.load('current', { packages: ['corechart'] });

  const chartInstances = {};
  function destroyChart(id) {
    if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
  }

  function renderFunnel(data) {
    google.charts.setOnLoadCallback(function () {
      const rows = data.map(function (d) { return [d.stage, d.count]; });
      const dataTable = google.visualization.arrayToDataTable([['Tahap', 'Jumlah Proyek']].concat(rows));
      const options = {
        legend: { position: 'none' },
        chartArea: { left: 140, top: 10, right: 30, bottom: 20 },
        colors: ['#2563eb'],
        hAxis: { minValue: 0, textStyle: { fontSize: 11 } },
        vAxis: { textStyle: { fontSize: 11 } },
        bar: { groupWidth: '65%' },
        fontName: 'Plus Jakarta Sans'
      };
      const el = document.getElementById('chartFunnel');
      if (!el) return;
      new google.visualization.BarChart(el).draw(dataTable, options);
    });
  }

  function renderStatusComparison(data) {
    destroyChart('comparison');
    const ctx = document.getElementById('chartComparison');
    if (!ctx) return;
    chartInstances.comparison = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: data.categories,
        datasets: [
          { label: 'Aktual (Tracking Lapangan)', data: data.aktual, backgroundColor: '#2563eb', borderRadius: 4 },
          { label: 'Sistem (Master PI)', data: data.sistem, backgroundColor: '#94a3b8', borderRadius: 4 }
        ]
      },
      options: {
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { font: { size: 11 } } } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { font: { size: 11 } } } }
      }
    });
  }
</script>
